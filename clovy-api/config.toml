[server]
host = "0.0.0.0"
port = 8080
request_timeout_secs = 600
# Refresh OpenRouter pricing and model metadata in-process so newly released
# models appear without restarting the production CVM.
model_catalog_refresh_secs = 300
max_audio_bytes = 26214400
max_json_bytes = 524288
# os-platform accepts 300 MiB attachments. The extra 1 MiB covers multipart
# framing and report text while keeping a single total request budget.
max_issue_report_bytes = 315621376
max_image_edit_bytes = 69921452
# Dedicated body cap for /v1/chat/completions, aligned with the desktop
# provider proxy's 12 MiB chat body cap (JUN-336) — the byte-image of the 6M-char
# semantic cap, sized for a 1M-token context window. Kept above the semantic
# agent chat string caps so in-window requests reach validate_agent_chat_body.
max_agent_chat_bytes = 12582912
# Global in-flight request-body budget for large-body agent routes.
max_agent_inflight_body_bytes = 1073741824
# Per-user concurrent request cap for large-body agent routes.
max_agent_concurrent_requests_per_user = 8

# Independent Browser use transport kill switches. Ops may override these as
# CLOVY__BROWSER_TRANSPORTS__ATTENDED_ENABLED and
# CLOVY__BROWSER_TRANSPORTS__MANAGED_ENABLED, then restart Clovy API.
[browser_transports]
attended_enabled = true
managed_enabled = true

# Public facts shown on the /verify attestation page. source_commit is not
# set here - the Docker build stamps it via CLOVY__ATTESTATION__SOURCE_COMMIT.
[attestation]
source_repo_url = "https://github.com/open-software-network/os-clovy"
image_repo = "ghcr.io/open-software-network/clovy-api"
trust_center_url = "https://trust.phala.com/app/6514acb0e08dc4825e2b6e22a46f0ed0ff455b54"

[issue_reports]
# User-submitted issue reports are filed as os-platform Issues for Clovy under
# the retained `june` project handle. The only per-environment value is the bot
# user's fellow API key
# (osk_...), set via CLOVY__ISSUE_REPORTS__OS_PLATFORM_API_KEY. Without it,
# reports are accepted but land in structured logs only.
os_platform_api_url = "https://app.opensoftware.co/api"
os_platform_api_key = ""
os_platform_org = "open-software"
os_platform_project = "june"
os_platform_label = "bug"
# Reward asset for the zero-reward Issue (required when the target Org has
# no default reward asset configured).
os_platform_reward_asset = "POINTS"
# Server-side diagnosis: reports arriving without a client diagnosis get one
# generated on this model at Clovy's own expense (never metered) before they
# are filed. Unset the model to turn diagnosis off. The call is bounded by
# the timeout, a 1024-token output cap, and a per-user hourly cap that skips
# the diagnosis (never the delivery) when exhausted.
diagnosis_model = "z-ai/glm-5.2"
diagnosis_timeout_secs = 10
diagnosis_max_per_user_per_hour = 6

[computer_use]
# Emergency rollout switch. Version entries accept exact values or a trailing
# wildcard such as "0.0.*" / "15.4.*".
enabled = true
disabled_clovy_versions = []
disabled_macos_versions = []

[os_accounts]
# api_url has no default - must come from CLOVY__OS_ACCOUNTS__API_URL
# per environment so a missing override fails loud against the dev
# fallback in AppConfig::default rather than silently hitting staging.
# iss is the canonical OS Accounts site URL used in the JWT's `iss` claim
# — the same value on staging and prod. JWKS lives on the API origin, but
# the issuer claim points at the canonical site. Confirmed by decoding a
# real staging token 2026-05-28.
iss = "https://accounts.opensoftware.co"
# aud is the canonical audience for tokens minted by OS Accounts for ANY
# consumer app, not a per-app value. Strict-string match.
aud = "open-software-apps"
jwks_refresh_secs = 300
jwks_miss_min_backoff_secs = 5
authorize_hold_ttl_note_transcribe_secs = 60
# Covers the bounded metered-inference client window (route timeout minus the
# authorize + settlement budgets = 390s) plus the settlement budget (150s),
# because note generation AND agent chat streaming settle their charge only
# after the upstream call completes. 300 let a 300-600s call reach `charge`
# with an expired hold. Same math as authorize_hold_ttl_image_secs.
authorize_hold_ttl_note_generate_secs = 540
authorize_hold_ttl_dictate_transcribe_secs = 30
authorize_hold_ttl_dictate_cleanup_secs = 30
note_transcribe_preview_max_audio_secs = 30
flat_estimate_credits = 250
# Flat per-request credits for the web tools. A Tavily basic search costs
# $0.008 (about 8 credits); a basic extract of one URL costs less.
web_search_credits = 20
web_fetch_credits = 20
authorize_hold_ttl_web_secs = 30

[share]
# Private sharing (JUN-308). Sharing endpoints answer 501 until a share
# database is configured. Set via CLOVY__SHARE__DATABASE_URL per environment.

database_url = ""
# OS Accounts sign-in origin for the browser viewer; empty falls back to
# os_accounts.iss. The viewer OAuth client id must be registered in OS
# Accounts with redirect https://<api-origin>/s/callback.
viewer_accounts_url = ""
viewer_client_id = ""
max_ciphertext_bytes = 10485760

# Clovy Companion is fail-closed outside local development until a dedicated
# Postgres URL is configured. APNs signing values are secret env-only inputs.
[companion]
database_url = ""
apns_team_id = ""
apns_key_id = ""
apns_private_key_pem = ""
apns_bundle_id = "co.opensoftware.june.companion"
apns_production = false

# Upstream base URLs. Service keys are secret env-only inputs:
# CLOVY__UPSTREAMS__<NAME>__API_KEY. A request carrying the user's own key for
# an upstream goes to the same base URL with that key.
[upstreams.groq]
base_url = "https://api.groq.com/openai/v1"

[upstreams.openrouter]
base_url = "https://openrouter.ai/api/v1"

[upstreams.fal]
base_url = "https://queue.fal.run"

[upstreams.tavily]
base_url = "https://api.tavily.com"

# Usage credit prices pass through upstream cost without a Clovy markup.
# Groq lists Whisper prices per HOUR of audio ($0.04 turbo, $0.111 large v3);
# these are per million seconds, rounded up: $/h ÷ 3600 × 1000 credits/$ × 1e6.
[pricing."whisper-large-v3-turbo"]
unit = "seconds"
credits_per_million_seconds = 11112
provider = "groq"
model_type = "asr"
display_name = "Whisper Large v3 Turbo"
description = "Fast multilingual Whisper transcription on Groq."
traits = ["prompt"]
capabilities = []

[pricing."whisper-large-v3"]
unit = "seconds"
credits_per_million_seconds = 30834
provider = "groq"
model_type = "asr"
display_name = "Whisper Large v3"
description = "Most accurate multilingual Whisper transcription on Groq."
traits = ["prompt"]
capabilities = []

# OpenRouter catalog prices (fetched 2026-10-08) for Clovy's default text
# models, per million tokens rounded up. The live catalog replaces them at
# startup; these keep metered charges settling when it is unreachable. Keep
# GLM 5.2 in sync with DEFAULT_GENERATION_MODEL in the Tauri providers module.
[pricing."z-ai/glm-5.2"]
unit = "tokens"
input_credits_per_million_tokens = 30
output_credits_per_million_tokens = 10000
provider = "openrouter"
model_type = "text"
display_name = "Z.ai: GLM 5.2"
context_tokens = 1048576
capabilities = [
  "supportsFunctionCalling",
  "supportsReasoning",
  "supportsResponseSchema",
]

[pricing."moonshotai/kimi-k2.6"]
unit = "tokens"
input_credits_per_million_tokens = 438
output_credits_per_million_tokens = 2450
provider = "openrouter"
model_type = "text"
display_name = "MoonshotAI: Kimi K2.6"
context_tokens = 262144
# Kimi K2.6 takes image input; it is the image-input fallback the app
# switches to. Keep in sync with its entry in default_pricing()
# (crates/config/src/lib.rs) so the fallback still resolves to a vision model
# when the live catalog is unreachable and this packaged config is what
# /models serves.
capabilities = [
  "supportsFunctionCalling",
  "supportsReasoning",
  "supportsResponseSchema",
  "supportsVision",
]

[pricing."nvidia/nemotron-3-nano-30b-a3b"]
unit = "tokens"
input_credits_per_million_tokens = 60
output_credits_per_million_tokens = 240
provider = "openrouter"
model_type = "text"
display_name = "NVIDIA: Nemotron 3 Nano 30B A3B"
context_tokens = 262144
capabilities = [
  "supportsFunctionCalling",
  "supportsReasoning",
  "supportsResponseSchema",
]
